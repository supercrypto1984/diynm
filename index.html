<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIY Avatar Creator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            flex: 1;
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            height: calc(100vh - 180px);
            overflow: hidden;
        }
        .flex {
            display: flex;
            gap: 20px;
            padding: 20px;
            height: 100%;
            width: 100%;
            box-sizing: border-box;
        }
        .preview-container {
            width: 500px;
            height: 500px;
            border: 2px dashed #333;
            position: relative;
            overflow: hidden;
            background-color: transparent;
            border-radius: 8px;
        }
        .preview-container.empty {
            background-image: none !important;
        }
        .preview-container.empty img {
            display: none !important;
        }
        .preview-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            pointer-events: none;
        }
        .button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 12px 24px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #45a049;
        }
        .button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .tab {
            overflow: hidden;
            border: 1px solid #333;
            background-color: #1a1a1a;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
            font-size: 16px;
            color: #fff;
        }
        .tab button:hover {
            background-color: #333;
        }
        .tab button.active {
            background-color: #4CAF50;
            color: white;
        }
        .tabcontent {
            display: none;
            padding: 20px;
            border: 1px solid #333;
            border-top: none;
            border-radius: 0 0 4px 4px;
            min-height: 400px;
            background-color: #1a1a1a;
            overflow-y: auto;
            height: calc(100% - 60px);
            margin-bottom: 10px;
        }
        .parts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            padding: 10px;
            padding-bottom: 30px;
            min-height: calc(100% - 40px);
        }
        .part-selector {
            border: 2px solid #333;
            cursor: pointer;
            transition: all 0.2s;
            padding: 8px;
            background: #2a2a2a;
            border-radius: 4px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .part-selector:hover {
            border-color: #4CAF50;
            transform: translateY(-2px);
        }
        .part-selector.selected {
            border-color: #4CAF50;
            background-color: #2d3d2d;
        }
        .part-selector img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }
        .series-selector {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .series-button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #1a1a1a;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }
        .series-button:hover {
            background-color: #333;
        }
        .series-button.active {
            background-color: #4CAF50;
            color: white;
        }
        .preview-section {
            flex: 0 0 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-right: 20px;
        }
        .components-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .none-icon {
            position: relative;
            width: 100%;
            height: 100%;
            border: 2px solid #333;
            border-radius: 50%;
        }
        .none-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120%;
            height: 2px;
            background-color: #333;
            transform: translate(-50%, -50%) rotate(45deg);
        }
        .part-selector.none-part {
            background: #2a2a2a;
        }
        .part-selector.none-part:hover {
            border-color: #4CAF50;
        }
        .part-selector.none-part.selected {
            border-color: #4CAF50;
            background-color: #2d3d2d;
        }
        .color-picker {
            position: absolute;
            width: 0;
            height: 0;
            padding: 0;
            border: none;
            visibility: hidden;
        }
        .status-message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .status-message.success {
            background-color: #4CAF50;
        }
        .status-message.error {
            background-color: #f44336;
        }
        .status-message.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="flex">
            <div class="preview-section">
                <div id="previewContainer" class="preview-container empty">
                    <img id="bodyLayer" class="preview-layer" alt="">
                    <img id="earringLayer" class="preview-layer" alt="">
                    <img id="eyesLayer" class="preview-layer" alt="">
                    <img id="headLayer" class="preview-layer" alt="">
                </div>
                
                <div class="button-group">
                    <button class="button" onclick="saveAvatar()">保存头像</button>
                    <button class="button" onclick="randomize()">随机搭配</button>
                </div>
                <div class="button-group">
                    <button class="button" onclick="setBgColor('transparent')">无背景</button>
                    <button class="button" onclick="setBgColor('#F97316')">橙色背景</button>
                    <button class="button" onclick="setAutoBgColor()">自动背景</button>
                    <button class="button" onclick="openColorPicker()">自选颜色</button>
                    <input type="color" id="colorPicker" class="color-picker" oninput="setCustomBgColor(this.value)">
                </div>

                <div class="series-selector">
                    <button class="series-button active" onclick="setActiveSeries('normal')">Normal</button>
                    <button class="series-button" onclick="setActiveSeries('dog')">Dog</button>
                    <button class="series-button" onclick="setActiveSeries('block')">Block</button>
                    <button class="series-button" onclick="setActiveSeries('rabbit')">Rabbit</button>
                    <button class="series-button" onclick="setActiveSeries('peer')">Peer</button>
                </div>
            </div>

            <div class="components-section">
                <div class="tab">
                    <button class="tablinks active" onclick="openTab(event, 'body')">Body</button>
                    <button class="tablinks" onclick="openTab(event, 'earring')">Earring</button>
                    <button class="tablinks" onclick="openTab(event, 'eyes')">Eyes</button>
                    <button class="tablinks" onclick="openTab(event, 'head')">Head</button>
                </div>

                <div id="body" class="tabcontent" style="display: block;">
                    <div id="bodyParts" class="parts-grid"></div>
                </div>

                <div id="earring" class="tabcontent">
                    <div id="earringParts" class="parts-grid"></div>
                </div>

                <div id="eyes" class="tabcontent">
                    <div id="eyesParts" class="parts-grid"></div>
                </div>

                <div id="head" class="tabcontent">
                    <div id="headParts" class="parts-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status message container -->
    <div id="statusMessage" class="status-message"></div>

    <script>
        const METADATA_URL = 'https://pub-ce8a03b190984a3d99332e13b7d5e3cb.r2.dev/metadata.json';
        const BASE_URLS = {
            block: 'https://pub-d7a7a960d42949efb84bea391aa90d4c.r2.dev',
            dog: 'https://pub-4d8b3f7049bb4025a6642c75eeb71c46.r2.dev',
            normal: 'https://pub-2f0821e8464b4c139f681d763393f4ee.r2.dev',
            peer: 'https://pub-026e5fdeaab545cc9c5aa34738735770.r2.dev',
            rabbit: 'https://pub-e50795db8d0d41dd942f04a8b290f95f.r2.dev'
        };
        const CATEGORIES = ['Body', 'Earring', 'Eyes', 'Head'];
        const SPECIAL_SERIES = ['Dog', 'Peer', 'Rabbit', 'Block'];
        
        const SERIES_COMPONENTS = {
            normal: ['Body', 'Earring', 'Eyes', 'Head'],
            dog: ['Body', 'Earring', 'Eyes'],
            block: ['Body', 'Earring', 'Eyes'],
            rabbit: ['Body', 'Earring', 'Eyes'],
            peer: ['Body', 'Eyes']
        };
        
        let metadata = [];
        let components = {
            normal: { Body: [], Earring: [], Eyes: [], Head: [] },
            dog: { Body: [], Earring: [], Eyes: [], Head: [] },
            block: { Body: [], Earring: [], Eyes: [], Head: [] },
            rabbit: { Body: [], Earring: [], Eyes: [], Head: [] },
            peer: { Body: [], Earring: [], Eyes: [], Head: [] }
        };
        let selectedParts = {
            Body: '', Earring: '', Eyes: '', Head: ''
        };
        let activeSeries = 'normal';
        
        let loadedImages = new Map();

        const backgroundColors = {
            albino: "#BDADAD", alien: "#04CFE7", beak: "#F8AC00", binary: "#010101",
            boned: "#000000", bot: "#484848", brown: "#310000", dark: "#482510",
            deathbot: "#282831", dos: "#0002A5", gold: "#FFAA01", green: "#002205",
            grey: "#232A30", hyena: "#BA8837", ion: "#060F26", light: "#B7844F",
            medium: "#945321", mempool: "#BE0B3A", moon: "#3501BB", patriot: "#0D0060",
            pepe: "#127602", pink: "#E944CE", purple: "#38034A", rainbow: "#009DFF",
            red: "#630001", safemode: "#000DFF", striped: "#110654", underlord: "#9C0901",
            vhs: "#0600FF", white: "#c7bcb6", wrapped: "#FFFFFF", zombie: "#104119"
        };

        function showStatus(message, type = 'success') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type} show`;
            
            setTimeout(() => {
                statusEl.classList.remove('show');
            }, 3000);
        }

        function handleImageError(event) {
            console.error('Image failed to load:', event.target.src);
            event.target.removeAttribute('src');
            event.target.style.display = 'none';
            event.target.removeEventListener('error', handleImageError);
        }

        function loadImageWithCORS(src) {
            return new Promise((resolve, reject) => {
                if (loadedImages.has(src)) {
                    resolve(loadedImages.get(src));
                    return;
                }

                const img = new Image();
                img.crossOrigin = 'anonymous';
                
                img.onload = () => {
                    // Create a canvas to store the image data
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    
                    try {
                        ctx.drawImage(img, 0, 0);
                        // Store the canvas for later use
                        loadedImages.set(src, canvas);
                        resolve(canvas);
                    } catch (error) {
                        console.error('Failed to draw image to canvas:', error);
                        reject(error);
                    }
                };
                
                img.onerror = () => {
                    console.error('Failed to load image:', src);
                    reject(new Error(`Failed to load image: ${src}`));
                };
                
                img.src = src;
            });
        }

        async function fetchMetadata() {
            try {
                console.log('Fetching metadata...');
                const response = await fetch(METADATA_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                console.log('Metadata fetched:', data);
                metadata = Array.isArray(data) ? data : [data];
                await processMetadata();
            } catch (error) {
                console.error('Error fetching metadata:', error);
                showStatus('加载数据失败，请刷新页面重试', 'error');
            }
        }

        async function processMetadata() {
            console.log('Processing metadata...');
            const uniqueComponents = {};
            CATEGORIES.forEach(category => {
                uniqueComponents[category] = new Set();
            });

            metadata.forEach(item => {
                if (item.attributes) {
                    CATEGORIES.forEach(category => {
                        const value = item.attributes[category];
                        if (value && value !== 'None') {
                            if (!(category === 'Head' && SPECIAL_SERIES.includes(value))) {
                                uniqueComponents[category].add(value);
                            }
                        }
                    });
                }
            });

            Object.entries(components).forEach(([series, categories]) => {
                SERIES_COMPONENTS[series].forEach(category => {
                    let parts = Array.from(uniqueComponents[category])
                        .map(value => {
                            const url = `${BASE_URLS[series]}/${category.toLowerCase()}/${value}.png`;
                            return {
                                url: url,
                                value: value
                            };
                        });

                    if (['Earring', 'Eyes'].includes(category) || 
                        (category === 'Head' && series === 'normal')) {
                        parts.unshift({ url: 'none', value: 'None' });
                    }

                    categories[category] = parts;
                });
            });

            console.log('Components processed:', components);

            const preloadPromises = [];
            Object.values(components).forEach(seriesComponents => {
                Object.values(seriesComponents).forEach(categoryComponents => {
                    categoryComponents.forEach(item => {
                        if (item.url !== 'none') {
                            const promise = loadImageWithCORS(item.url)
                                .then(() => item)
                                .catch(() => null);
                            preloadPromises.push(promise);
                        }
                    });
                });
            });

            try {
                const loadedComponents = await Promise.all(preloadPromises);
                Object.entries(components).forEach(([series, categories]) => {
                    Object.entries(categories).forEach(([category, parts]) => {
                        categories[category] = parts.filter(item => 
                            item.url === 'none' || 
                            loadedComponents.some(comp => comp && comp.url === item.url)
                        ).map(item => item.url);
                    });
                });
                console.log('All images preloaded');
                showStatus('头像组件加载完成！', 'success');
            } catch (error) {
                console.error('Error preloading images:', error);
                showStatus('部分图片加载失败', 'error');
            }

            updatePartsGrid();
        }

        function updatePartsGrid() {
            CATEGORIES.forEach(category => {
                const container = document.getElementById(`${category.toLowerCase()}Parts`);
                if (!container) {
                    console.error(`Container not found for category: ${category}`);
                    return;
                }
                container.innerHTML = '';
                
                if (!SERIES_COMPONENTS[activeSeries].includes(category)) {
                    container.innerHTML = '<div class="no-components">此系列不支持该组件</div>';
                    return;
                }

                const parts = components[activeSeries][category];
                if (!parts || parts.length === 0) {
                    container.innerHTML = '<div class="no-components">没有可用组件</div>';
                    return;
                }

                parts.forEach(src => {
                    const div = document.createElement('div');
                    if (src === 'none') {
                        div.className = `part-selector none-part ${selectedParts[category] === src ? 'selected' : ''}`;
                        const noneIcon = document.createElement('div');
                        noneIcon.className = 'none-icon';
                        div.appendChild(noneIcon);
                    } else {
                        div.className = `part-selector ${selectedParts[category] === src ? 'selected' : ''}`;
                        const img = document.createElement('img');
                        img.alt = src.split('/').pop().replace('.png', '');
                        img.addEventListener('error', handleImageError, { once: true });
                        img.src = src;
                        div.appendChild(img);
                    }
                    div.onclick = () => selectPart(category, src);
                    container.appendChild(div);
                });
            });
        }

        function selectPart(category, src) {
            selectedParts[category] = src;
            const layer = document.getElementById(`${category.toLowerCase()}Layer`);
            if (layer) {
                if (src === 'none') {
                    layer.removeAttribute('src');
                    layer.style.display = 'none';
                } else {
                    layer.src = src;
                    layer.style.display = 'block';
                }
            }
            
            const previewContainer = document.getElementById('previewContainer');
            if (Object.values(selectedParts).some(part => part && part !== 'none')) {
                previewContainer.classList.remove('empty');
            } else {
                previewContainer.classList.add('empty');
            }
            
            updatePartsGrid();
        }

        function setActiveSeries(series) {
            activeSeries = series;
            
            document.querySelectorAll('.series-button').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.toLowerCase() === series);
            });
            
            const previewContainer = document.getElementById('previewContainer');
            previewContainer.classList.add('empty');
            previewContainer.style.backgroundColor = 'transparent';
            
            CATEGORIES.forEach(category => {
                selectedParts[category] = '';
                const layer = document.getElementById(`${category.toLowerCase()}Layer`);
                if (layer) {
                    layer.removeAttribute('src');
                    layer.style.display = 'none';
                }
            });
            
            updatePartsGrid();
        }

        function openTab(evt, categoryName) {
            const tabcontent = document.getElementsByClassName("tabcontent");
            for (let i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }

            const tablinks = document.getElementsByClassName("tablinks");
            for (let i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }

            document.getElementById(categoryName).style.display = "block";
            evt.currentTarget.className += " active";
        }

        function randomize() {
            const previewContainer = document.getElementById('previewContainer');
            previewContainer.classList.remove('empty');
            
            CATEGORIES.forEach(category => {
                if (!SERIES_COMPONENTS[activeSeries].includes(category)) {
                    return;
                }
                
                const parts = components[activeSeries][category];
                if (parts && parts.length > 0) {
                    const validParts = parts.filter(src => src !== 'none');
                    if (validParts.length > 0) {
                        const randomIndex = Math.floor(Math.random() * validParts.length);
                        selectPart(category, validParts[randomIndex]);
                    }
                }
            });
            
            showStatus('随机搭配完成！', 'success');
        }

        function setBgColor(color) {
            document.getElementById('previewContainer').style.backgroundColor = color;
        }

        function setAutoBgColor() {
            if (!selectedParts.Body) {
                showStatus('请先选择身体部件', 'error');
                return;
            }

            const filename = selectedParts.Body.split('/').pop().toLowerCase();
            for (const [key, color] of Object.entries(backgroundColors)) {
                if (filename.includes(key.toLowerCase())) {
                    setBgColor(color);
                    showStatus('自动背景设置完成！', 'success');
                    return;
                }
            }
            setBgColor('transparent');
            showStatus('未找到匹配的背景色，已设为透明', 'success');
        }

        function openColorPicker() {
            const colorPicker = document.getElementById('colorPicker');
            const currentColor = document.getElementById('previewContainer').style.backgroundColor;
            if (currentColor && currentColor !== 'transparent') {
                if (currentColor.startsWith('rgb')) {
                    const rgb = currentColor.match(/\d+/g);
                    if (rgb) {
                        const hex = '#' + rgb.map(x => parseInt(x).toString(16).padStart(2, '0')).join('');
                        colorPicker.value = hex;
                    }
                } else {
                    colorPicker.value = currentColor;
                }
            }
            colorPicker.click();
        }

        function setCustomBgColor(color) {
            document.getElementById('previewContainer').style.backgroundColor = color;
        }

        async function saveAvatar() {
            try {
                showStatus('正在生成头像...', 'success');
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                canvas.width = 28 * 36;
                canvas.height = 28 * 36;
                
                ctx.imageSmoothingEnabled = false;
                ctx.webkitImageSmoothingEnabled = false;
                ctx.mozImageSmoothingEnabled = false;
                ctx.msImageSmoothingEnabled = false;

                const bgColor = document.getElementById('previewContainer').style.backgroundColor;
                if (bgColor && bgColor !== 'transparent') {
                    ctx.fillStyle = bgColor;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                for (const category of CATEGORIES) {
                    const imgSrc = selectedParts[category];
                    if (imgSrc && imgSrc !== 'none') {
                        try {
                            const imageCanvas = loadedImages.get(imgSrc);
                            if (imageCanvas) {
                                ctx.drawImage(imageCanvas, 0, 0, canvas.width, canvas.height);
                            } else {
                                console.warn(`Image not found in cache: ${imgSrc}`);
                                const loadedCanvas = await loadImageWithCORS(imgSrc);
                                ctx.drawImage(loadedCanvas, 0, 0, canvas.width, canvas.height);
                            }
                        } catch (error) {
                            console.error(`Failed to draw ${category}:`, error);
                            showStatus(`绘制${category}失败: ${error.message}`, 'error');
                        }
                    }
                }

                canvas.toBlob(blob => {
                    if (!blob) {
                        showStatus('生成图片失败，请重试', 'error');
                        return;
                    }

                    const url = URL.createObjectURL(blob);
                    
                    if (window.parent !== window) {
                        console.log('Running in iframe, sending message to parent');
                        window.parent.postMessage({
                            type: 'download',
                            url: url,
                            filename: `avatar-${Date.now()}.png`
                        }, '*');
                    } else {
                        console.log('Running standalone, downloading directly');
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = `avatar-${Date.now()}.png`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    }
                    
                    // Clean up
                    setTimeout(() => {
                        URL.revokeObjectURL(url);
                    }, 100);
                    
                    showStatus('头像保存成功！', 'success');
                }, 'image/png', 1.0);

            } catch (error) {
                console.error('Save failed:', error);
                showStatus(`保存失败: ${error.message}`, 'error');
            }
        }

        // Initialize event listeners
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.preview-layer').forEach(img => {
                img.addEventListener('error', handleImageError, { once: true });
            });

            document.querySelectorAll('.tablinks').forEach(button => {
                button.addEventListener('click', (e) => {
                    openTab(e, e.target.textContent.toLowerCase());
                });
            });

            document.querySelectorAll('.series-button').forEach(button => {
                button.addEventListener('click', () => {
                    setActiveSeries(button.textContent.toLowerCase());
                });
            });

            const previewContainer = document.getElementById('previewContainer');
            previewContainer.classList.add('empty');

            document.querySelector('.tablinks').classList.add('active');
            document.getElementById('body').style.display = 'block';

            document.addEventListener('keydown', (e) => {
                if (e.key === 'r' && e.ctrlKey) {
                    e.preventDefault();
                    randomize();
                } else if (e.key === 's' && e.ctrlKey) {
                    e.preventDefault();
                    saveAvatar();
                }
            });

            fetchMetadata();
        });
    </script>
</body>
</html>
